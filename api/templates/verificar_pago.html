{% extends "base.html" %}

{% block content %}

<div class="view-screen">

    <main class="main-container">

        <section class="menu-section">

            <div class="menu-header anim-fade-down">
                <div>
                    <h2>Estado del pago</h2>
                    <p class="subtitle">Consulta el estado actual de tu transacción.</p>
                </div>
            </div>

            <div class="payment-status-card anim-fade-up">

                <div class="payment-status-info anim-fade-left">
                    <p><strong>Referencia:</strong> {{ transaccion.referencia }}</p>
                    <p>
                        <strong>Estado en nuestra aplicación:</strong>
                        <span class="payment-status">{{ transaccion.estado_pago }}</span>
                    </p>
                </div>

                <div class="payment-response anim-fade-up anim-delay-2">
                    <h3>Respuesta de Factus Pay</h3>
                    <pre>{{ resultado }}</pre>
                </div>

                <div class="checkout-actions anim-fade-up anim-delay-3">
                    <a href="{% url 'productos' %}">
                        <button class="btn btn-primary anim-hover-up">
                            Volver a productos
                        </button>
                    </a>
                </div>

            </div>

        </section>

    </main>

</div>


<style>
    .payment-status-card {
    max-width: 800px;
    margin: 0 auto;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 30px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-color);
}

.payment-status-info {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
}

.payment-status-info p {
    color: var(--text-muted);
}

.payment-status-info strong {
    color: var(--text-main);
}

.payment-status {
    color: var(--primary);
    font-weight: 700;
    text-transform: capitalize;
}

.payment-response {
    background-color: var(--bg-surface);
    border-radius: var(--radius-md);
    padding: 20px;
}

.payment-response h3 {
    margin-bottom: 12px;
}

.payment-response pre {
    background-color: var(--bg-dark);
    color: white;
    padding: 15px;
    border-radius: var(--radius-md);
    overflow-x: auto;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-word;
}

@media (max-width: 600px) {
    .payment-status-card {
        padding: 20px;
    }

    .payment-response {
        padding: 15px;
    }
}
</style>
{% endblock %}
